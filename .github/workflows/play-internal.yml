name: Play Internal Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "검증을 마친 비공개 Draft Release 태그 (예: play-5)"
        required: true
        type: string
      expected_commit:
        description: "Draft Release가 가리켜야 하는 검증 완료 커밋 SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify prepared Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_COMMIT"
          ACTUAL_COMMIT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          test "$IS_DRAFT" = "true"
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" = "1"
          test "$(find . -maxdepth 1 -type f -name '*.aab' | wc -l | tr -d ' ')" = "1"
          test "$(find . -maxdepth 1 -type f -name '*-SHA256SUMS.txt' | wc -l | tr -d ' ')" = "1"
          shasum -a 256 -c ./*-SHA256SUMS.txt
          jarsigner -verify ./*.aab
          shasum -a 256 ./*.aab > uploaded-aab-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cheongyakhannun-release-files
          path: release-assets/
          retention-days: 7
      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.softm.cheongyakhannun
          releaseFiles: release-assets/*.aab
          track: internal
          status: completed
