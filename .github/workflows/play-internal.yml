name: Play Internal Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "검증을 마친 비공개 Draft Release 태그 (예: play-5)"
        required: true
        type: string
      expected_commit:
        description: "Draft Release가 가리켜야 하는 검증 완료 커밋 SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify prepared Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          RELEASE_ID="$(jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag and .draft == true)] | if length == 1 then .[0].id else empty end' releases.json)"
          test -n "$RELEASE_ID"
          ACTUAL_COMMIT="$(jq -r --argjson release_id "$RELEASE_ID" '.[] | select(.id == $release_id) | .target_commitish' releases.json)"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          mkdir -p release-assets
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            test -n "$ASSET_ID"
            test -n "$ASSET_NAME"
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "release-assets/$ASSET_NAME"
          done < <(jq -r --argjson release_id "$RELEASE_ID" '.[] | select(.id == $release_id) | .assets[] | [.id, .name] | @tsv' releases.json)
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" = "1"
          test "$(find . -maxdepth 1 -type f -name '*.aab' | wc -l | tr -d ' ')" = "1"
          test "$(find . -maxdepth 1 -type f -name '*-SHA256SUMS.txt' | wc -l | tr -d ' ')" = "1"
          shasum -a 256 -c ./*-SHA256SUMS.txt
          jarsigner -verify ./*.aab
          shasum -a 256 ./*.aab > uploaded-aab-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cheongyakhannun-release-files
          path: release-assets/
          retention-days: 7
      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.softm.cheongyakhannun
          releaseFiles: release-assets/*.aab
          track: internal
          status: completed
